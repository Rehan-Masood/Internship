<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}MailFlow{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--nav:#111943;--purple:#6250e8;--bg:#f5f7fb}
    body{background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif}
    .sidebar{background:var(--nav);min-height:100vh;color:#fff}
    .brand{font-size:1.35rem;font-weight:800;padding:24px}
    .nav-link{color:#c9cde0;border-radius:10px;margin:3px 12px;padding:11px 14px}
    .nav-link:hover,.nav-link.active{background:var(--purple);color:#fff}
    .content{padding:28px}
    .card{border:1px solid #e8eaf2;border-radius:16px;box-shadow:0 3px 18px rgba(25,35,70,.05)}
    .stat{min-height:130px}
    .stat-value{font-size:1.9rem;font-weight:800;color:#111943}
    .small-label{font-size:.78rem;color:#737a92;text-transform:uppercase;font-weight:700}
    .badge-soft{background:#eef0ff;color:#5b4ed8}
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <aside class="col-lg-2 col-md-3 sidebar px-0">
      <div class="brand">✈ MailFlow</div>
      <nav>
        <a class="nav-link" href="{{ url_for('dashboard.index') }}">▣ Dashboard</a>
        <a class="nav-link" href="{{ url_for('campaigns.index') }}">➤ Campaigns</a>
        <a class="nav-link" href="{{ url_for('contacts.index') }}">♙ Contacts</a>
        <a class="nav-link" href="{{ url_for('templates.index') }}">▤ Email Templates</a>
        <a class="nav-link" href="{{ url_for('logs.index') }}">☷ Email Logs</a>
        <a class="nav-link" href="{{ url_for('settings.index') }}">⚙ Settings</a>
      </nav>
    </aside>
    <main class="col-lg-10 col-md-9 content">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
