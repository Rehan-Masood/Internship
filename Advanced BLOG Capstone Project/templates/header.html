<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>{% block title %}CineJournal — Modern Thoughts & Stories{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top py-3" id="mainNav">
      <div class="container px-4 px-lg-5">
        <a class="navbar-brand fw-bold fs-4 d-flex align-items-center text-white text-decoration-none" href="{{ url_for('get_all_posts') }}">
          <i class="fa-solid fa-feather-pointed text-primary me-2 fs-3"></i>
          <span>CineJournal</span>
        </a>
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
          <i class="fas fa-bars fs-4 text-white"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ms-auto py-3 py-lg-0 align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link px-3 fw-semibold text-white opacity-75 hover-opacity-100" href="{{ url_for('get_all_posts') }}">Home</a>
            </li>

            {% if not current_user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link px-3 fw-semibold text-white opacity-75 hover-opacity-100" href="{{ url_for('login') }}">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-3 fw-semibold text-white opacity-75 hover-opacity-100" href="{{ url_for('register') }}">Register</a>
            </li>
            {% else %}
            <li class="nav-item">
              <a class="nav-link px-3 fw-semibold text-danger" href="{{ url_for('logout') }}">Log Out</a>
            </li>
            {% endif %}

            <li class="nav-item">
              <a class="nav-link px-3 fw-semibold text-white opacity-75 hover-opacity-100" href="{{ url_for('about') }}">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-3 fw-semibold text-white opacity-75 hover-opacity-100" href="{{ url_for('contact') }}">Contact</a>
            </li>

            {% if current_user.id == 1 %}
            <li class="nav-item ms-lg-2 mt-3 mt-lg-0">
              <a class="btn btn-primary-gradient btn-sm px-4 py-2 rounded-pill fw-bold" href="{{ url_for('add_new_post') }}">
                <i class="fa-solid fa-pen-nib me-1.5"></i> Create Article
              </a>
            </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
