{% extends "base.html" %}
{% block title %}Register — SecureAuth{% endblock %}

{% block content %}
<div class="container px-4 my-auto py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 col-xl-4">
      
      <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-purple bg-opacity-10 text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
            <i class="fa-solid fa-user-plus fs-4"></i>
          </div>
          <h3 class="fw-bold text-white mb-1">Create Account</h3>
          <p class="text-secondary small">Join our secure platform in less than a minute.</p>
        </div>

        <form method="post" action="{{ url_for('register') }}" class="d-flex flex-column gap-3">
          <div>
            <label class="form-label text-secondary small fw-bold">FULL NAME</label>
            <input type="text" name="name" class="form-control" placeholder="Alex Morgan" required autocomplete="name" />
          </div>

          <div>
            <label class="form-label text-secondary small fw-bold">EMAIL ADDRESS</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required autocomplete="email" />
          </div>

          <div>
            <label class="form-label text-secondary small fw-bold">CREATE PASSWORD</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="new-password" />
          </div>

          <button type="submit" class="btn btn-primary-gradient w-100 py-3 rounded-pill fw-bold mt-2">
            Sign Me Up
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
          <p class="small text-secondary mb-0">
            Already registered? <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-bold ms-1">Sign in instead</a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
