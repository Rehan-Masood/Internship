<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>{% block title %}CineJournal — Modern Thoughts & Stories{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <style>
      :root {
        --bg-dark: #07090e;
        --bg-card: rgba(15, 22, 36, 0.75);
        --border-glass: rgba(255, 255, 255, 0.08);
        --primary-accent: #6366f1;
        --purple-accent: #a855f7;
        --gradient-main: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        --gradient-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-dark);
        background-image: 
          radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.06) 0px, transparent 50%);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .font-serif { font-family: 'Playfair Display', Georgia, serif; }
      .fw-black { font-weight: 900; }

      /* Glassmorphic Cards */
      .glass-card {
        background: var(--bg-card);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border-glass);
        border-radius: 20px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      }

      /* Compact Hero Header */
      .masthead {
        min-height: 260px !important;
        padding-top: 100px !important;
        padding-bottom: 2rem !important;
        background-size: cover;
        background-position: center;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .overlay-dark {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(7, 9, 14, 0.7) 0%, rgba(7, 9, 14, 0.98) 100%);
        z-index: 1;
      }

      /* Navbar */
      .navbar-dark {
        background: rgba(7, 9, 14, 0.9) !important;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border-glass);
      }

      /* Premium Buttons */
      .btn-primary-gradient {
        background: var(--gradient-main) !important;
        border: none !important;
        color: #ffffff !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
      }

      .btn-primary-gradient:hover {
        background: var(--gradient-hover) !important;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
      }

      .btn-glass-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        color: #ffffff;
        text-decoration: none;
      }

      .btn-glass-icon:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.1);
        color: #ffffff;
      }

      /* Blog Card Grid */
      .blog-card {
        background: var(--bg-card);
        border: 1px solid var(--border-glass);
        border-radius: 20px;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .blog-card:hover {
        transform: translateY(-8px);
        border-color: rgba(99, 102, 241, 0.4);
        box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.7);
      }

      .card-img-wrapper {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16/10;
      }

      .card-img-wrapper img {
        transition: transform 0.5s ease;
      }

      .blog-card:hover .card-img-wrapper img {
        transform: scale(1.06);
      }

      .hover-primary { transition: color 0.2s ease; }
      .hover-primary:hover { color: #818cf8 !important; }

      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Form inputs styling */
      .form-control, .form-select {
        background: rgba(8, 12, 20, 0.7) !important;
        border: 1px solid var(--border-glass) !important;
        color: #ffffff !important;
        border-radius: 14px !important;
        padding: 12px 18px !important;
      }

      .form-control:focus {
        border-color: #a855f7 !important;
        box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.25) !important;
      }

      .form-label {
        color: #94a3b8;
        font-weight: 600;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }

      /* Footer */
      footer { background-color: #040508; }
      .social-icon-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-glass);
        color: #94a3b8;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: all 0.3s ease;
      }

      .social-icon-btn:hover {
        background: var(--gradient-main);
        color: #ffffff;
        transform: translateY(-3px);
      }
    </style>
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top py-3" id="mainNav">
      <div class="container px-4 px-lg-5">
        <a class="navbar-brand fw-bold fs-4 d-flex align-items-center text-white text-decoration-none" href="{{ url_for('get_all_posts') }}">
          <i class="fa-solid fa-feather-pointed text-primary me-2 fs-3"></i>
          <span>CineJournal</span>
        </a>
        <button
          class="navbar-toggler border-0 shadow-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarResponsive"
          aria-controls="navbarResponsive"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="fas fa-bars fs-4 text-white"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ms-auto py-3 py-lg-0 align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link px-3 fw-semibold text-white opacity-75 hover-opacity-100" href="{{ url_for('get_all_posts') }}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-3 fw-semibold text-white opacity-75 hover-opacity-100" href="{{ url_for('about') }}">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-3 fw-semibold text-white opacity-75 hover-opacity-100" href="{{ url_for('contact') }}">Contact</a>
            </li>
            <li class="nav-item ms-lg-2 mt-3 mt-lg-0">
              <a class="btn btn-primary-gradient btn-sm px-4 py-2 rounded-pill fw-bold" href="{{ url_for('add_new_post') }}">
                <i class="fa-solid fa-pen-nib me-1.5"></i> Write Post
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
