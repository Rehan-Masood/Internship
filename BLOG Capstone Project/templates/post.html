{% include "header.html" %}

<header class="masthead position-relative overflow-hidden" style="background-image: url('{{ post.img_url }}')">
  <div class="overlay-dark"></div>
  <div class="container position-relative px-4 px-lg-5 py-5 z-2 text-center">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        <h1 class="display-4 fw-black text-white font-serif mb-3">{{ post.title }}</h1>
        <h2 class="h5 text-white-50 fw-normal mb-4">{{ post.subtitle }}</h2>
        
        <div class="d-flex align-items-center justify-content-center gap-3 text-secondary small">
          <span class="text-white fw-bold"><i class="fa-regular fa-user text-primary me-1"></i> {{ post.author }}</span>
          <span>•</span>
          <span><i class="fa-regular fa-calendar me-1"></i> {{ post.date }}</span>
        </div>
      </div>
    </div>
  </div>
</header>

<article class="py-5">
  <div class="container px-4 px-lg-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div class="d-flex justify-content-between align-items-center mb-5 p-3 glass-card rounded-4">
          <a href="{{ url_for('get_all_posts') }}" class="text-secondary text-decoration-none small fw-semibold">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to All Posts
          </a>
          <a href="{{ url_for('edit_post', post_id=post.id) }}" class="btn btn-primary-gradient btn-sm px-4 rounded-pill fw-bold">
            <i class="fa-solid fa-pen-to-square me-1"></i> Edit Article
          </a>
        </div>

        <div class="article-content text-light fs-5 line-height-relaxed mb-5">
          {{ post.body | safe }}
        </div>

      </div>
    </div>
  </div>
</article>

{% include "footer.html" %}
