```yaml
name: DockFlow CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. TEST APPLICATION
  # ==========================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DockFlow

    env:
      PYTHONPATH: ${{ github.workspace }}/DockFlow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: DockFlow/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Compile Python
        run: python -m compileall -q app run.py


  # ==========================================
  # 2. BUILD DOCKER IMAGE
  # ==========================================
  docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    # Don't build Docker image for pull requests
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dockflow:${{ github.sha }} ./DockFlow

      - name: Smoke test image
        run: |
          docker run -d \
            --name dockflow-smoke \
            -p 5000:5000 \
            -e SECRET_KEY=ci-secret \
            -e APP_ENV=CI \
            dockflow:${{ github.sha }}

          sleep 8

          curl --fail http://127.0.0.1:5000/health

          docker logs dockflow-smoke

          docker rm -f dockflow-smoke


  # ==========================================
  # 3. DEPLOYMENT HANDOFF
  # ==========================================
  deploy:
    name: Deployment Handoff
    needs: docker
    runs-on: ubuntu-latest

    # Deploy only when code is pushed directly to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deployment handoff
        run: |
          echo "Docker build and smoke test passed."
          echo "Configure your Render/AWS deployment integration here."
```
