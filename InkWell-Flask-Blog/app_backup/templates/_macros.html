{% macro avatar(user, size=40) %}
    {% if user.profile_image %}
        <img src="{{ url_for('static', filename='profile_pics/' + user.profile_image) }}"
             class="avatar" style="width:{{ size }}px; height:{{ size }}px;" alt="{{ user.username }}">
    {% else %}
        <div class="avatar-initials" style="width:{{ size }}px; height:{{ size }}px; font-size:{{ size * 0.4 }}px;">
            {{ user.initials }}
        </div>
    {% endif %}
{% endmacro %}
