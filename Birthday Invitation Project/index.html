<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Invitation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
        }

        .invitation-card {
            background: linear-gradient(145deg, #12131a, #08080c);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 
                        0 0 15px rgba(212, 175, 55, 0.15);
            text-align: center;
            color: #e5e5e5;
            position: relative;
        }

        .tagline {
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #d4af37;
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 1.1rem;
            color: #ffffff;
            font-weight: 400;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .cake-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 25px;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 1.1rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .location-name {
            font-size: 0.95rem;
            color: #ffffff;
            font-weight: 400;
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
            margin-bottom: 30px;
        }

        li {
            font-size: 0.95rem;
            color: #cccccc;
            margin-bottom: 8px;
            font-weight: 300;
        }

        .btn-link {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #0b0b0f;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 50px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <p class="tagline">You Are Invited</p>
        
        <!-- Main Heading -->
        <h1>It's My Birthday!</h1>

        <!-- Subheading -->
        <h2>On the 25th July</h2>

        <!-- Your Happy Birthday Cake Image -->
        <img class="cake-img" 
             src="cake.png" 
             alt="Happy Birthday Cake with Candles">

        <!-- List Section -->
        <h3 class="section-title">What to bring:</h3>
        <ul>
            <li>✨ Balloons (I love balloons)</li>
            <li>🍰 Cake (I'm really good at eating)</li>
            <li>🥂 An appetite (There will be lots of food)</li>
        </ul>

        <!-- Location Section -->
        <h3 class="section-title">This is where you need to go:</h3>
        <p class="location-name">📍 COMSATS University Islamabad, Vehari Campus</p>
        <a href="https://maps.google.com/?q=COMSATS+University+Islamabad+Vehari+Campus" 
           target="_blank" 
           class="btn-link">Google Map Link</a>
    </div>

</body>
</html>
