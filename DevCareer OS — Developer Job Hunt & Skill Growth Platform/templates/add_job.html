{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 650px;">
    <div class="glass-card p-4 p-md-5">
        <h2 class="fw-bold mb-4"><i class="fa-solid fa-plus-circle text-cyan me-2"></i>Log Job Application</h2>

        <form action="{{ url_for('add_job') }}" method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">COMPANY NAME</label>
                <input type="text" name="company" class="form-control glass-input" required placeholder="e.g. Google, Microsoft, Startup">
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">POSITION / ROLE</label>
                <input type="text" name="position" class="form-control glass-input" required placeholder="e.g. Junior Python Developer">
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label text-muted small fw-bold">PIPELINE STATUS</label>
                    <select name="status" class="form-select glass-select">
                        <option value="Applied">🔷 Applied</option>
                        <option value="Interviewing">🟡 Interviewing</option>
                        <option value="Offer">🟢 Offer Received</option>
                        <option value="Rejected">🔴 Rejected</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-muted small fw-bold">ESTIMATED SALARY</label>
                    <input type="text" name="salary" class="form-control glass-input" placeholder="e.g. $85,000/yr">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label text-muted small fw-bold">DATE APPLIED</label>
                    <input type="date" name="applied_date" class="form-control glass-input">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-muted small fw-bold">INTERVIEW DATE (OPTIONAL)</label>
                    <input type="date" name="interview_date" class="form-control glass-input">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">NOTES / REFERRAL / RECRUITER CONTACT</label>
                <textarea name="notes" class="form-control glass-input" rows="3" placeholder="Referred by Alex... Recruiter email: recruiter@company.com"></textarea>
            </div>

            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-gradient flex-grow-1 py-2 shadow-glow">Save Application</button>
                <a href="{{ url_for('index') }}" class="btn btn-glass px-4 py-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
