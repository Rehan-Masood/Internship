{% extends "base.html" %}

{% block title %}Add New Book — My Library{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                    <i class="fa-solid fa-book-medical fs-3"></i>
                </div>
                <h2 class="fw-bold mb-1">Add a New Book</h2>
                <p class="text-secondary small">Enter book details to append to your library database.</p>
            </div>

            <form action="{{ url_for('add') }}" method="POST">
                <div class="mb-3">
                    <label for="title" class="form-label text-secondary small fw-semibold">BOOK TITLE</label>
                    <input type="text" class="form-control form-control-dark" id="title" name="title" placeholder="e.g. Harry Potter" required>
                </div>

                <div class="mb-3">
                    <label for="author" class="form-label text-secondary small fw-semibold">BOOK AUTHOR</label>
                    <input type="text" class="form-control form-control-dark" id="author" name="author" placeholder="e.g. J.K. Rowling" required>
                </div>

                <div class="mb-4">
                    <label for="rating" class="form-label text-secondary small fw-semibold">RATING (0 to 10)</label>
                    <input type="number" step="0.1" min="0" max="10" class="form-control form-control-dark" id="rating" name="rating" placeholder="e.g. 9.5" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-gradient py-3">
                        <i class="fa-solid fa-check me-2"></i> Add Book
                    </button>
                    <a href="{{ url_for('home') }}" class="btn btn-glass py-2 text-center mt-2">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
